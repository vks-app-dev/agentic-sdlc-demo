# SDLC Pilot config. Generated by /sdlc-init; safe to edit by hand.
version: 1
project:
  name: agentic-sdlc-demo
  type: new
  compliance: []
stack:
  languages: [python]
  framework: fastapi
  commands: {install: uv sync, test: uv run pytest, lint: uv run ruff check ., run: 'uv run --with uvicorn
      uvicorn app.main:app --port 8000', secrets: gitleaks detect --no-banner --redact}
  package_manager: uv
  test_tools: [pytest]
integrations:
  tracker: local
  vcs: git
  ci: null
  pull_requests: false   # set to true in your own fork (needs the GitHub CLI, gh) for one PR per work item
  remote: origin
  base_branch: main
  draft_prs: true
  status_checks: true
  hosts: [claude]
stages:
  requirements:
    enabled: true
    autonomy: L2
    gate: [developer]
  design:
    enabled: true
    autonomy: L2
    gate: [developer]
    security_review_on: [auth, pii]
  development:
    enabled: true
    autonomy: L2
    gate: [developer]
    parallel_coders: 3
    tdd: true
    max_attempts: 3
  cicd:
    enabled: false
    autonomy: L3
    gate: []
  qa:
    enabled: true
    autonomy: L2
    gate: [qa-lead]
  release:
    enabled: true
    autonomy: L1
    gate: [release-manager]
  production:
    enabled: false
    autonomy: L2
    gate: [on-call]
  monitoring:
    enabled: false
    autonomy: L2
    gate: []
  planning:
    enabled: true
    autonomy: L2
    gate: [tech-lead]
test_env:
  env: {EXPENSE_DB_PATH: '{data}/expenses.db'}
  url: http://127.0.0.1:{port}/health
work_types:
  feature:
    stages: [requirements, design, planning, development]
  change:
    stages: [requirements, design, planning, development]
    design_if_size: [M, L]
  bug:
    stages: [requirements, development]
    gates:
      requirements: []
  task:
    stages: [development]
environments:
  staging:
    deploy: scripts/staging.sh deploy
    rollback: scripts/staging.sh rollback
    url: http://127.0.0.1:8200
    smoke: ['curl -fsS http://127.0.0.1:8200/health']
